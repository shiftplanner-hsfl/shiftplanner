name: User Story
description: Neue Anforderung aus Nutzersicht
title: "[Story] "
labels: ["typ: user-story", "bereich: anforderungen"]
body:
  - type: input
    id: kennung
    attributes:
      label: Kennung
      placeholder: US-001
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Als <Rolle> möchte ich <Ziel>, damit <Nutzen>."
      placeholder: Als Filialleitung möchte ich ..., damit ...
    validations:
      required: true
  - type: textarea
    id: akzeptanz
    attributes:
      label: Akzeptanzkriterien (Given/When/Then)
      placeholder: |
        - Given ..., When ..., Then ...
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale – warum gibt es diese Anforderung?
    validations:
      required: true
  - type: input
    id: quelle
    attributes:
      label: Stakeholder und Quelle (Pre-Traceability)
      description: Wer braucht das? Aus welchem Feedback stammt es?
      placeholder: "Filialleitung; FB-003 (Interview)"
    validations:
      required: true
  - type: dropdown
    id: prio
    attributes:
      label: Priorität (MoSCoW)
      options: [Must, Should, Could, "Won't"]
    validations:
      required: true
